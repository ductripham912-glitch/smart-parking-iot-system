[platformio]
default_envs = lot

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:gate_in]
board = esp32dev
build_src_filter = -<*> +<gate_in/>
lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32
    bblanchon/ArduinoJson@^7
    miguelbalboa/MFRC522@^1.4.11
    madhephaestus/ESP32Servo
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:gate_out]
board = esp32dev
build_src_filter = -<*> +<gate_out/>
lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32
    bblanchon/ArduinoJson@^7
    miguelbalboa/MFRC522@^1.4.11
    madhephaestus/ESP32Servo
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    
[env:lot]
board = esp32dev
build_src_filter = -<*> +<lot/>

[env:reset]
board = esp32dev
build_src_filter = -<*> +<reset/>
upload_speed = 115200

[env:uid_test]
board = esp32dev
build_src_filter = -<*> +<uid_test/>
lib_deps =
    miguelbalboa/MFRC522@^1.4.11